<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blog Blob</title>
</head>
<body>
<h1>Login</h1>
<div th:if="${error}">
    Unable to login. Check your username and password.
</div>
<p>New here? Click
    <a th:href="@{/users/register}">here</a> to register.</p>
<!-- tag::thAction[] -->
<form method="POST" th:action="@{/authenticate}" id="loginForm">
    <!-- end::thAction[] -->
    <label for="username">Username: </label>
    <input type="text" name="user" id="username" /><br/>
    <label for="password">Password: </label>
    <input type="password" name="pwd" id="password" /><br/>
    <input type="submit" value="Login"/>
</form>
</body>
</html>
